  <script>
    window.addEventListener('error', function (event) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '0';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.backgroundColor = '#fee2e2';
      errorDiv.style.color = '#991b1b';
      errorDiv.style.padding = '1rem';
      errorDiv.style.zIndex = '9999';
      errorDiv.style.borderBottom = '1px solid #ef4444';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.textContent = 'Global Error: ' + event.message + ' at ' + event.filename + ':' + event.lineno;
      document.body.appendChild(errorDiv);
      console.error('Global Error:', event.error);
    });

    window.addEventListener('unhandledrejection', function (event) {
      const errorDiv = document.createElement('div');
      errorDiv.style.position = 'fixed';
      errorDiv.style.top = '50px';
      errorDiv.style.left = '0';
      errorDiv.style.width = '100%';
      errorDiv.style.backgroundColor = '#fef3c7';
      errorDiv.style.color = '#92400e';
      errorDiv.style.padding = '1rem';
      errorDiv.style.zIndex = '9999';
      errorDiv.style.borderBottom = '1px solid #f59e0b';
      errorDiv.style.fontFamily = 'monospace';
      errorDiv.textContent = 'Unhandled Promise Rejection: ' + event.reason;
      document.body.appendChild(errorDiv);
      console.error('Unhandled Rejection:', event.reason);
    });
  </script>

  <!-- Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js')
          .then(function (registration) {
            console.log('✅ Service Worker registered:', registration.scope);

            // تحقق من التحديثات
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'activated') {
                  console.log('🔄 New Service Worker activated!');
                }
              });
            });

            // 🚀 resume/start font download check
            if (registration.active) {
              registration.active.postMessage('CHECK_AND_DOWNLOAD_FONTS');
            } else if (navigator.serviceWorker.controller) {
              navigator.serviceWorker.controller.postMessage('CHECK_AND_DOWNLOAD_FONTS');
            }
          })
          .catch(function (err) {
            console.log('❌ Service Worker registration failed:', err);
          });

        // Handle case where controller creates/changes
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (navigator.serviceWorker.controller) {
            navigator.serviceWorker.controller.postMessage('CHECK_AND_DOWNLOAD_FONTS');
          }
        });
      });
    }
  </script>
