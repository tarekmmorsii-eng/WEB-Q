apply plugin: 'com.android.application'

// Opt-in local tajweed APK; production assets and the standard flavor stay untouched.
def tajweedTrial = providers.gradleProperty('tajweedTrial').orElse('false').get().toBoolean()
if (tajweedTrial) {
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.project == project && it.name.toLowerCase().contains('standard') }) {
            throw new GradleException('Tajweed trial assets are allowed only in the beta flavor.')
        }
    }
}

// Keep Meta entirely out of the app until credentials and dashboard setup are ready.
def metaEventsEnabled = providers.gradleProperty('metaEventsEnabled').orElse('false').get().toBoolean()
def metaLocalProperties = new Properties()
def metaLocalFile = rootProject.file('meta-events.local.properties')
if (metaLocalFile.exists()) {
    metaLocalFile.withInputStream { metaLocalProperties.load(it) }
}
def metaClientToken = providers.environmentVariable('META_CLIENT_TOKEN')
        .orElse(metaLocalProperties.getProperty('META_CLIENT_TOKEN', '')).get().trim()
if (metaEventsEnabled && !metaClientToken.matches('[a-zA-Z0-9]+')) {
    throw new GradleException('Meta App Events requires a valid META_CLIENT_TOKEN before enabling.')
}


// تحميل بيانات التوقيع من ملف keystore.properties خارج تتبع git
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    if (tajweedTrial) {
        sourceSets.main.assets.srcDirs = [rootProject.file('../artifacts/tajweed-native-assets')]
    }
    namespace = "com.mushafalmurajaa.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.mushafalmurajaa.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders += [metaEventsEnabled: metaEventsEnabled.toString()]
        resValue "string", "facebook_client_token", metaEventsEnabled ? metaClientToken : ""
        versionCode 10
        versionName "1.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // نسخ منفصلة: النسخة الأصلية والنسخة التجريبية بمعرّف مختلف لتثبّت بجانب الأصلية
    flavorDimensions "env"
    productFlavors {
        standard {
            // النسخة الأصلية: المعرّف com.mushafalmurajaa.app (دون تغيير)
        }
        beta {
            applicationIdSuffix ".beta"
        }
    }
    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    if (metaEventsEnabled) {
        implementation 'com.facebook.android:facebook-core:19.0.0'
    }
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
